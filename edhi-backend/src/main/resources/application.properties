spring.application.name=edhi-painel

# No computador usa o PostgreSQL local. No Render, as variáveis DB_* vêm do banco de lá (render.yaml).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edhi_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Hibernate cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

# Conta da Edilene, criada na primeira vez que a API sobe.
# Antes de usar de verdade, troque a senha pela variavel de ambiente EDHI_ADMIN_SENHA.
edhi.admin.nome=Edilene
edhi.admin.email=edileneeumais@gmail.com
edhi.admin.senha=${EDHI_ADMIN_SENHA:1234567}
# No ar (EDHI_PRODUCAO=true) a API não sobe com a senha padrão acima
edhi.producao=${EDHI_PRODUCAO:false}

# Quanto tempo o login dura (horas) e quantas senhas erradas seguidas travam o e-mail
edhi.sessao.horas=168
edhi.login.max-tentativas=5
edhi.login.janela-minutos=15
